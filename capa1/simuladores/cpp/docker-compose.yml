services:
  simulator-cpp:
    build: .
    container_name: urbia-sim-cpp
    restart: unless-stopped
    environment:
      - BROKER_HOST=192.168.0.101
      - BROKER_PORT=1883
      - NODE_ID=192.168.0.104
      - INTERVALO_SEG=5
      - SEED_BASE=42
    volumes:
      - /opt/urbia/capa1/comun:/opt/urbia/capa1/comun:ro
    networks:
      - urbia-sim
    healthcheck:
      test: ["CMD", "pgrep", "urbia_sensor"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  urbia-sim:
    external: true
